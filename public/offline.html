<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Central Tools</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f6f8; color: #212529;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { text-align: center; background: #fff; padding: 2.5rem 3rem; border-radius: .5rem;
               box-shadow: 0 1px 3px rgba(0,0,0,.1); max-width: 28rem; }
        .icon { font-size: 3rem; }
        h1 { font-size: 1.25rem; margin: .75rem 0 .5rem; }
        p { color: #6c757d; margin: 0 0 1.25rem; }
        button { background: #0d6efd; color: #fff; border: 0; padding: .5rem 1.25rem;
                 border-radius: .375rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>Anda sedang offline</h1>
        <p>Halaman ini belum pernah dibuka sebelumnya, sehingga tidak tersedia saat offline.
           Sambungkan kabel LAN kembali untuk mengaksesnya.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
